<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartMeal AI - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#eae1d8",
                        "on-primary-container": "#ffeeea",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#004a78",
                        "inverse-primary": "#ffb5a0",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#d0e5d4",
                        "tertiary-container": "#0073b6",
                        "surface-container-high": "#f0e7de",
                        "primary": "#9f2c05",
                        "on-secondary-container": "#54675a",
                        "outline-variant": "#e0bfb7",
                        "surface-dim": "#e2d8d0",
                        "on-primary": "#ffffff",
                        "text-secondary": "#6B6259",
                        "on-tertiary-container": "#ebf3ff",
                        "outline": "#8c7169",
                        "danger": "#B4432E",
                        "background": "#FBF7F0",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#34302a",
                        "surface-container-highest": "#eae1d8",
                        "secondary-fixed": "#d3e8d7",
                        "on-primary-fixed-variant": "#872100",
                        "on-background": "#1f1b16",
                        "on-secondary-fixed": "#0e1f15",
                        "primary-container": "#c1441e",
                        "on-error": "#ffffff",
                        "surface-container-low": "#fcf2e9",
                        "on-secondary-fixed-variant": "#394b3e",
                        "on-tertiary": "#ffffff",
                        "border": "#E5DDD0",
                        "error": "#ba1a1a",
                        "secondary": "#506355",
                        "surface": "#FFFFFF",
                        "surface-alt": "#F3ECE0",
                        "surface-container": "#f6ece4",
                        "secondary-fixed-dim": "#b7ccbb",
                        "tertiary-fixed": "#cfe5ff",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#ffb5a0",
                        "warning": "#D98E2B",
                        "on-tertiary-fixed": "#001d33",
                        "surface-bright": "#fff8f3",
                        "on-surface": "#1f1b16",
                        "inverse-on-surface": "#f9efe6",
                        "success": "#4C7A5E",
                        "tertiary": "#005a90",
                        "primary-fixed": "#ffdbd1",
                        "primary-hover": "#A63715",
                        "on-surface-variant": "#59413b",
                        "surface-tint": "#ab350f",
                        "on-primary-fixed": "#3b0900",
                        "tertiary-fixed-dim": "#98cbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap-lg": "96px",
                        "base": "8px",
                        "margin": "32px",
                        "max-width": "1200px",
                        "section-gap-sm": "64px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "hero-mobile": ["Newsreader"],
                        "h1": ["Newsreader"],
                        "h2": ["Newsreader"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "hero": ["Newsreader"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "hero-mobile": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "hero": ["64px", { "lineHeight": "1.1", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        /* Custom scrollbar for multi-select chips */
        .chip-scroll::-webkit-scrollbar { height: 4px; }
        .chip-scroll::-webkit-scrollbar-track { background: transparent; }
        .chip-scroll::-webkit-scrollbar-thumb { background-color: theme('colors.surface-dim'); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-lg antialiased">
<!-- Top App Bar (Suppress Navigation - Onboarding Intent) -->
<header class="w-full sticky top-0 z-50 bg-background flex justify-between items-center px-margin py-4 max-w-max-width mx-auto">
<div class="font-h1 text-h1 font-bold text-primary">SmartMeal AI</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-section-gap-sm px-4 md:px-margin max-w-max-width mx-auto w-full">
<div class="w-full max-w-2xl bg-surface rounded-xl border border-border p-6 md:p-10 shadow-[0_4px_24px_rgba(31,27,22,0.04)]">
<div class="mb-8 text-center">
<h1 class="font-hero-mobile text-hero-mobile md:font-hero md:text-h1 text-primary mb-2">Let's set your table</h1>
<p class="font-body-lg text-body-lg text-text-secondary">Tell us a bit about how you eat, and we'll craft the perfect plan.</p>
</div>
<form class="space-y-8">
<!-- 1. Dietary Preference -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps uppercase text-text-secondary">Dietary Preference</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input class="peer sr-only" name="diet" type="radio" value="vegetarian"/>
<div class="px-4 py-2 rounded-full border border-border text-on-background font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors hover:bg-surface-variant">Vegetarian</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="diet" type="radio" value="non-vegetarian"/>
<div class="px-4 py-2 rounded-full border border-border text-on-background font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors hover:bg-surface-variant">Non-Vegetarian</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="diet" type="radio" value="vegan"/>
<div class="px-4 py-2 rounded-full border border-border text-on-background font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors hover:bg-surface-variant">Vegan</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="diet" type="radio" value="keto"/>
<div class="px-4 py-2 rounded-full border border-border text-on-background font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors hover:bg-surface-variant">Keto</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="diet" type="radio" value="none"/>
<div class="px-4 py-2 rounded-full border border-border text-on-background font-body-sm text-body-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors hover:bg-surface-variant">No Restriction</div>
</label>
</div>
</div>
<!-- 2. Allergies -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps uppercase text-text-secondary">Allergies &amp; Dislikes</label>
<div class="flex flex-nowrap overflow-x-auto pb-2 gap-2 chip-scroll">
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="allergy" type="checkbox" value="nuts"/>
<div class="px-3 py-1.5 rounded-full bg-surface-alt text-secondary font-body-sm text-body-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">eco</span> Nuts</div>
</label>
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="allergy" type="checkbox" value="dairy"/>
<div class="px-3 py-1.5 rounded-full bg-surface-alt text-secondary font-body-sm text-body-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">local_drink</span> Dairy</div>
</label>
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="allergy" type="checkbox" value="shellfish"/>
<div class="px-3 py-1.5 rounded-full bg-surface-alt text-secondary font-body-sm text-body-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">set_meal</span> Shellfish</div>
</label>
<label class="cursor-pointer shrink-0">
<input class="peer sr-only" name="allergy" type="checkbox" value="gluten"/>
<div class="px-3 py-1.5 rounded-full bg-surface-alt text-secondary font-body-sm text-body-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">breakfast_dining</span> Gluten</div>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- 3. Daily Budget -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps uppercase text-text-secondary block" for="budget">Daily Budget</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-text-secondary font-body-lg text-body-lg">
                                $
                            </div>
<input class="block w-full pl-7 pr-3 py-2 border border-border rounded-lg bg-surface text-on-background font-body-lg text-body-lg focus:ring-primary focus:border-primary" id="budget" min="0" name="budget" placeholder="25.00" step="0.50" type="number"/>
</div>
</div>
<!-- 4. Household Size -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps uppercase text-text-secondary block">Household Size</label>
<div class="flex items-center border border-border rounded-lg bg-surface w-fit">
<button class="px-3 py-2 text-text-secondary hover:text-primary transition-colors" onclick="document.getElementById('household').stepDown()" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="w-12 text-center border-none bg-transparent font-body-lg text-body-lg text-on-background focus:ring-0 p-0 m-0" id="household" max="12" min="1" name="household" type="number" value="2"/>
<button class="px-3 py-2 text-text-secondary hover:text-primary transition-colors" onclick="document.getElementById('household').stepUp()" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
</div>
<!-- 5. Pantry Items -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps uppercase text-text-secondary block" for="pantry">What's in your pantry?</label>
<p class="font-body-sm text-body-sm text-text-secondary mt-1">We'll use what's already in your kitchen first.</p>
<div class="relative">
<input class="block w-full px-3 py-2 border border-border rounded-lg bg-surface text-on-background font-body-lg text-body-lg focus:ring-primary focus:border-primary mb-2" id="pantry" placeholder="e.g., Rice, Pasta, Olive Oil... (press enter)" type="text"/>
<!-- Simulated added tags -->
<div class="flex flex-wrap gap-2 mt-2">
<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-surface-alt text-on-background font-body-sm text-body-sm">
                                Olive Oil <button class="text-text-secondary hover:text-danger" type="button"><span class="material-symbols-outlined text-[14px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-surface-alt text-on-background font-body-sm text-body-sm">
                                Basmati Rice <button class="text-text-secondary hover:text-danger" type="button"><span class="material-symbols-outlined text-[14px]">close</span></button>
</span>
</div>
</div>
</div>
<!-- Submit CTA -->
<div class="pt-6 border-t border-border mt-8">
<button class="w-full bg-primary hover:bg-primary-hover text-on-primary font-body-lg text-body-lg font-semibold py-3 px-6 rounded-full transition-colors shadow-[0_4px_12px_rgba(159,44,5,0.2)]" type="button">
                        Generate My Plan
                    </button>
</div>
</form>
</div>
</main>
</body></html>
